name: Android build and audit

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 37.2 and Build Tools 36.0.0
        run: sdkmanager --install "platforms;android-37.2" "build-tools;36.0.0"

      # Bootstrap the wrapper from the pinned Gradle installation. The files
      # are uploaded below so they can be committed to the repository. Once
      # committed, this bootstrap step can be removed and CI can call ./gradlew.
      - name: Generate pinned Gradle Wrapper
        run: >-
          gradle --no-daemon wrapper
          --gradle-version 9.9.2
          --distribution-type bin
          --gradle-distribution-sha256-sum 971fcd7150ca4ba04852c0b2ca0d2d0ab9468e14b03473eab19528809914c76b

      - name: Verify generated Gradle Wrapper
        run: ./gradlew --no-daemon --version

      - name: Static project audit
        run: python3 tools/verify_android_project.py

      - name: Enforce offline map architecture
        run: python3 tools/verify_offline_map_architecture.py

      - name: JVM regression tests
        run: bash tools/run_jvm_tests.sh

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Run Android Lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      # The generated wrapper is a bootstrap artifact until its files are
      # committed to the repository. Keep the artifact short-lived.
      - name: Upload Gradle Wrapper bootstrap files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-wrapper-bootstrap
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: warn
          retention-days: 14

      # Keep diagnostics and the APK available even when Android Lint fails.
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gps-test-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android Lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

name: Android build and audit

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK and Build Tools 36.0.0
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Static project audit
        run: python3 tools/verify_android_project.py

      - name: Enforce offline map architecture
        run: python3 tools/verify_offline_map_architecture.py

      - name: JVM regression tests
        run: bash tools/run_jvm_tests.sh

      - name: Assemble debug APK and run Android Lint
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gps-test-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
